<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>뉴스 브리핑</title>
    <script>
      // GitHub Pages SPA redirect
      // /ai_book/news → /ai_book/?/news
      var path = window.location.pathname;
      var base = '/ai_book/';
      if (path.startsWith(base)) {
        var route = path.slice(base.length);
        if (route && route !== 'index.html') {
          window.location.replace(base + '?' + route);
        }
      }
    </script>
  </head>
  <body></body>
</html>
